<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Modex Premium Lifestyle: gadgets, chargers, power banks and digital services."><meta name="theme-color" content="#0A0A0C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23111'/%3E%3Cpath d='M16 46V18l16 18 16-18v28' fill='none' stroke='%23fff' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>html{color-scheme:light}[hidden]{display:none!important}body{margin:0}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<title>Modex | Premium Lifestyle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=Outfit:wght@700;800&display=swap">
<style>
/* Layout: cinematic dark hero carousel over a quiet Apple-style light/dark shop; boldness lives in the hero, everything else stays calm. */
:root{
  --bg:#F5F5F7; --surface:#FFFFFF; --surface2:#F0F0F3; --ink:#1D1D1F; --muted:#6B6B72; --line:rgba(20,20,40,.1);
  --accent:#F0521A; --accent-ink:#FFFFFF; --accent-soft:rgba(240,82,26,.1);
  --good:#12805A; --good-soft:rgba(18,128,90,.12); --warn:#9A6200; --warn-soft:rgba(200,130,0,.15); --bad:#C42D45; --bad-soft:rgba(196,45,69,.12);
  --tl1:94%; --tl2:86%; --il:34%;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(20,20,40,.08);
  --font:'Inter','Hind Siliguri',system-ui,-apple-system,'Segoe UI',sans-serif;
  --display:'Space Grotesk','Hind Siliguri',system-ui,sans-serif;
  --logo:'Outfit','Inter',system-ui,sans-serif;
  --r:22px; --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0A0A0C; --surface:#151518; --surface2:#1E1E22; --ink:#F5F5F7; --muted:#9B9BA3; --line:rgba(255,255,255,.11);
    --accent:#FF6B35; --accent-soft:rgba(255,107,53,.16);
    --good:#3DD598; --good-soft:rgba(61,213,152,.14); --warn:#F5B84A; --warn-soft:rgba(245,184,74,.15); --bad:#FF6B81; --bad-soft:rgba(255,107,129,.15);
    --tl1:19%; --tl2:13%; --il:72%; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#0A0A0C; --surface:#151518; --surface2:#1E1E22; --ink:#F5F5F7; --muted:#9B9BA3; --line:rgba(255,255,255,.11);
    --accent:#FF6B35; --accent-soft:rgba(255,107,53,.16);
    --good:#3DD598; --good-soft:rgba(61,213,152,.14); --warn:#F5B84A; --warn-soft:rgba(245,184,74,.15); --bad:#FF6B81; --bad-soft:rgba(255,107,129,.15);
    --tl1:19%; --tl2:13%; --il:72%; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark }
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--font);-webkit-font-smoothing:antialiased;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:1200px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ui{flex:none}
.num{font-variant-numeric:tabular-nums}
html:has(dialog[open]){overflow:hidden}

/* announcement + nav */
.announce{background:var(--ink);color:var(--bg);font-size:13px;text-align:center;padding:8px 0}
.announce .wrap{display:flex;justify-content:center}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:8px;min-height:68px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:11px;text-decoration:none;min-width:0;color:var(--ink)}
.logo .wm{display:grid;gap:5px;line-height:1;min-width:0}
.logo .wm b{font:800 24px/1 var(--logo);letter-spacing:.14em;color:var(--ink)}
.logo .wm b em{font-style:normal;background:linear-gradient(90deg,#B9801F,#EBAA3A);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.logo .wm small{font:700 8.5px/1 var(--font);letter-spacing:.24em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.logo .mk{position:relative;flex:none;width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#2B2421 0%,#8C5C1F 55%,#E8A93A 100%);display:grid;place-items:center;color:#fff;font:800 22px/1 var(--logo);box-shadow:0 8px 18px -8px rgba(210,150,40,.6)}
.logo .mk::after{content:"";position:absolute;left:-3px;bottom:-3px;width:14px;height:14px;border-radius:50%;background:#22C55E;border:2.5px solid var(--bg)}
.links{display:none;gap:4px;margin-left:22px}
.links a{padding:8px 12px;border-radius:999px;font-size:14px;color:var(--muted);text-decoration:none;transition:color .2s,background .2s}
.links a:hover{color:var(--ink);background:var(--surface2)}
.sp{flex:1}
.ibtn{position:relative;height:40px;min-width:40px;padding:0 10px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink);transition:background .2s,transform .2s var(--ease);font-size:14px;font-weight:500}
.ibtn:hover{background:var(--surface2)} .ibtn:active{transform:scale(.94)}
.ibtn .lbl{display:none}
.badge{position:absolute;top:2px;right:0;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;transition:transform .3s var(--ease)}
.badge[hidden]{display:none}
.badge.pop{transform:scale(1.35)}
@media (min-width:860px){.links{display:flex}.ibtn .lbl{display:inline}}
.lang{display:inline-flex;padding:3px;border-radius:999px;background:var(--surface2);gap:2px;flex:none}
.lang button{min-width:40px;height:30px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);transition:background .25s var(--ease),color .25s,box-shadow .25s}
.lang button:hover{color:var(--ink)}
.lang button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.fl{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
@media (max-width:519px){
  .nav .wrap{gap:4px}
  .logo{gap:9px}
  .logo .mk{width:38px;height:38px;border-radius:12px;font-size:20px}
  .logo .wm b{font-size:21px}
  .logo .wm small{font-size:7.5px;letter-spacing:.2em}
  .ibtn{min-width:36px;padding:0 6px}
  .lang button{min-width:34px;padding:0 8px}
  .ibtn.admn{display:none}
  .nav .wrap{flex-wrap:nowrap;min-height:72px;padding-top:12px;padding-bottom:12px}
  .logo{flex:0 1 auto;overflow:visible}
  .logo .mk{width:40px;height:40px}
  .ibtn{min-width:32px;padding:0 4px}
  .lang{padding:2px}.lang button{min-width:30px;padding:0 6px;font-size:12px}
}
@media (max-width:359px){.logo .wm b{font-size:18px}.logo .wm small{font-size:6.5px;letter-spacing:.14em}.logo .mk{width:34px;height:34px;font-size:18px}.logo{gap:7px}.ibtn{min-width:28px}.lang button{min-width:26px;padding:0 5px}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;transition:transform .25s var(--ease),box-shadow .25s,background .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);color:var(--accent-ink)} .btn.pri:hover{box-shadow:0 10px 26px -8px var(--accent)}
.btn.sec{background:var(--surface2);color:var(--ink)} .btn.sec:hover{background:var(--line)}
.btn.sm{height:38px;padding:0 16px;font-size:14px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.light{background:#fff;color:#111} .btn.light:hover{box-shadow:0 12px 30px -10px rgba(255,255,255,.6)}
.btn.glass{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(10px)} .btn.glass:hover{background:rgba(255,255,255,.2)}

/* hero */
.hero{position:relative;color:#fff;overflow:hidden;background:#0D0D10;--px:0;--py:0}
.track{position:relative;height:660px}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .9s var(--ease),visibility .9s}
.slide.active{opacity:1;visibility:visible}
.slide .bg{position:absolute;inset:0;overflow:hidden}
.slide .bg::before,.slide .bg::after{content:"";position:absolute;border-radius:50%;filter:blur(30px);will-change:transform}
.slide .bg::before{width:70%;aspect-ratio:1;right:-8%;top:-18%;animation:drift 16s ease-in-out infinite alternate}
.slide .bg::after{width:50%;aspect-ratio:1;left:-12%;bottom:-30%;animation:drift 21s ease-in-out infinite alternate-reverse}
.s1{background:#0D0D10}.s1 .bg::before{background:radial-gradient(circle,rgba(255,92,32,.6),transparent 65%)}.s1 .bg::after{background:radial-gradient(circle,rgba(255,170,90,.2),transparent 65%)}
.s2{background:#041F26}.s2 .bg::before{background:radial-gradient(circle,rgba(36,214,168,.5),transparent 65%)}.s2 .bg::after{background:radial-gradient(circle,rgba(90,200,255,.16),transparent 65%)}
.s3{background:#220A16}.s3 .bg::before{background:radial-gradient(circle,rgba(255,74,108,.55),transparent 65%)}.s3 .bg::after{background:radial-gradient(circle,rgba(255,170,120,.18),transparent 65%)}
.hero-in{position:relative;height:100%;display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr;align-items:center;gap:10px;padding-block:42px 64px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.eyebrow::before{content:"";width:22px;height:2px;border-radius:2px;background:currentColor}
.copy .h1{font-size:clamp(34px,6.4vw,66px);font-weight:700;letter-spacing:-.025em;line-height:1.18;margin:14px 0}
.copy .h1 span{display:inline-block;opacity:0;transform:translateY(.45em)}
.slide.active .h1 span{animation:rise .9s var(--ease) both;animation-delay:calc(var(--i)*70ms + 150ms)}
.copy p{max-width:46ch;color:rgba(255,255,255,.74);font-size:clamp(15px,1.7vw,18px)}
.copy .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.slide.active .copy .eyebrow,.slide.active .copy p,.slide.active .copy .cta{animation:fade .9s var(--ease) both .35s}
.stage{position:relative;width:min(100%,430px);aspect-ratio:1/.8;margin-inline:auto}
.gc{position:absolute;transform:translate3d(calc(var(--px)*var(--d)*1px),calc(var(--py)*var(--d)*1px),0);transition:transform .25s ease-out}
.gc .in{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:26px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 24px 60px -24px rgba(0,0,0,.6);animation:float 6s ease-in-out infinite}
.gc.g-b .in{animation-delay:-2s}.gc.g-c .in{animation-delay:-4s}
.gc .ic{width:62%;max-height:70%}
.gc b{font:600 14px var(--display)} .gc span{font-size:12px;color:rgba(255,255,255,.65)}
.g-a{left:24%;top:4%;width:52%;height:64%}.g-b{left:0;top:44%;width:36%;height:42%}.g-c{right:0;bottom:0;width:34%;height:42%}
.ic{stroke:currentColor;fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.ic .t{fill:currentColor;fill-opacity:.16}
.w{color:#fff}
.chip{position:absolute;display:flex;align-items:center;gap:12px;padding:12px 18px 12px 12px;border-radius:22px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transform:translate3d(calc(var(--px)*var(--d)*1px),calc(var(--py)*var(--d)*1px),0);box-shadow:0 20px 50px -22px rgba(0,0,0,.6)}
.chip .ic{width:44px;height:44px;padding:8px;border-radius:14px;background:rgba(255,255,255,.12)}
.chip b{display:block;font:600 15px var(--display)} .chip small{display:block;font-size:12px;color:rgba(255,255,255,.65)}
.c1{left:0;top:6%}.c2{left:14%;top:38%}.c3{left:2%;top:70%}
.chip i{font-style:normal;margin-left:8px;font-size:11px;font-weight:700;color:#08130F;background:#5EEAC0;border-radius:999px;padding:3px 9px}
.coin-wrap{position:absolute;left:50%;top:50%;width:54%;aspect-ratio:1;translate:-50% -50%;perspective:900px;transform:translate3d(calc(var(--px)*1.2px),calc(var(--py)*1.2px),0)}
.coin{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:spin 7s linear infinite}
.face{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#FFE3A8,#FFB347 45%,#D9731A);box-shadow:inset 0 0 0 7px rgba(255,255,255,.28),inset 0 0 0 9px rgba(120,50,0,.25),0 30px 70px -20px rgba(255,90,60,.6);backface-visibility:hidden;color:#5A2A00}
.face.bk{transform:rotateY(180deg)}
.face .ic{width:54%;stroke-width:4}
.orbit{position:absolute;inset:0;border-radius:50%;border:1px dashed rgba(255,255,255,.22);scale:1.38;animation:spin2 18s linear infinite}
.orbit::after{content:"";position:absolute;top:-5px;left:50%;width:10px;height:10px;border-radius:50%;background:#FFB347;box-shadow:0 0 18px #FFB347}
.lockchip{position:absolute;right:0;bottom:6%;display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(12px);font-size:13px;font-weight:600;transform:translate3d(calc(var(--px)*1.6px),calc(var(--py)*1.6px),0)}
.pills{position:absolute;left:0;right:0;bottom:22px;z-index:3}
.pills .wrap{display:flex;gap:8px;align-items:center}
.pill{position:relative;width:34px;height:6px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden;padding:0}
.pill::after{content:"";position:absolute;inset:0;background:#fff;transform-origin:left;transform:scaleX(0)}
.pill.on::after{animation:prog 6.5s linear forwards}
.hero.paused .pill.on::after{animation-play-state:paused}
.pill:focus-visible{outline-color:#fff}
@media (min-width:860px){
  .track{height:620px}
  .hero-in{grid-template-columns:1.05fr .95fr;grid-template-rows:1fr;gap:40px;padding-block:56px 70px}
}
@keyframes drift{to{transform:translate3d(-6%,8%,0) scale(1.12)}}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes rise{from{opacity:0;transform:translateY(.45em)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotateY(360deg)}}
@keyframes spin2{to{rotate:360deg}}
@keyframes prog{to{transform:scaleX(1)}}
@keyframes sheet{from{opacity:0;transform:translateY(28px) scale(.985)}to{opacity:1;transform:none}}
@keyframes drawer{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}

/* sections */
section.sec{padding-block:72px}
.sec-h{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:14px;margin-bottom:28px}
.sec-h h2{font-size:clamp(26px,4vw,40px);letter-spacing:-.02em}
.sec-h p{color:var(--muted);max-width:52ch;margin-top:8px}
.trust{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding-block:28px}
.trust div{display:flex;gap:12px;align-items:flex-start;min-width:0}
.trust .ui{margin-top:3px;color:var(--accent)}
.trust b{display:block;font-size:15px} .trust span{display:block;font-size:13px;color:var(--muted);line-height:1.5}
@media (min-width:760px){.trust{grid-template-columns:repeat(3,1fr)}}

/* shop */
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:22px}
.tabs{display:flex;gap:6px;padding:4px;background:var(--surface2);border-radius:999px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs button{padding:8px 18px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap;transition:all .25s var(--ease)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.field{position:relative;flex:1;min-width:180px}
.field .ui{position:absolute;left:14px;top:50%;translate:0 -50%;color:var(--muted)}
.field input{padding-left:42px}
input,select,textarea{width:100%;height:46px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);outline:none;transition:border-color .2s,box-shadow .2s}
textarea{height:auto;padding:12px 14px;resize:vertical;min-height:84px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 20px,calc(100% - 15px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.bar select{width:auto;min-width:150px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,164px),1fr));gap:14px}
@media (min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}}
.card{background:var(--surface);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .45s var(--ease),box-shadow .45s var(--ease);min-width:0}
.card:hover{transform:translateY(-4px)}
.hit{display:block;text-align:left;width:100%}
.art{position:relative;aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden;background:linear-gradient(150deg,hsl(var(--h) 70% var(--tl1)),hsl(calc(var(--h) + 24) 60% var(--tl2)));color:hsl(var(--h) 55% var(--il))}
.art .ic{width:46%;max-height:70%;transition:transform .6s var(--ease)}
.card:hover .art .ic{transform:scale(1.08) rotate(-3deg)}
.art.img img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.card:hover .art.img img{transform:scale(1.05)}
.tags{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.tag.dg{background:var(--ink);color:var(--bg)} .tag.off{background:var(--accent);color:#fff}
.cb{display:block;padding:14px 16px 4px}
.cb .cat{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.cb h3{font-size:16px;line-height:1.35;font-family:var(--font);font-weight:600}
.cb .sh{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5}
.pr{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px 14px 16px;margin-top:auto}
.pr b{font:700 18px var(--display)} .pr s{display:block;font-size:12px;color:var(--muted)} .pr small{display:block;font-size:11px;color:var(--muted)}
.add{width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;transition:transform .25s var(--ease),box-shadow .25s;flex:none}
.add:hover{box-shadow:0 8px 20px -6px var(--accent);transform:scale(1.06)} .add:active{transform:scale(.92)}
.pa{display:flex;align-items:center;gap:8px;flex:none}
.bn{height:42px;padding:0 14px;border-radius:999px;background:var(--surface2);color:var(--ink);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;font:600 13px var(--font);white-space:nowrap;transition:transform .25s var(--ease),box-shadow .25s,background-color .2s,color .2s,border-color .2s}

const T=(s,v)=>{let r=LANG==='en'&&EN[s]!==undefined?EN[s]:s;if(v)r=r.replace(/\{(\w+)\}/g,(m,k)=>v[k]!==undefined?v[k]:m);return r};
const tp=(p,k)=>(LANG==='en'&&p.en&&p.en[k])?p.en[k]:p[k];
const tl=(p,k,i)=>{const e=LANG==='en'&&p.en&&Array.isArray(p.en[k])?p.en[k][i]:null;if(e)return e;const v=(p[k]||[])[i];return v&&typeof v==='object'?v.label:v};
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}
async function copy(text,msg){
  try{await navigator.clipboard.writeText(text);toast(msg||T('কপি হয়েছে'))}
  catch(e){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(msg||T('কপি হয়েছে'))}catch(_){toast(T('কপি করা যায়নি, হাতে সিলেক্ট করুন'))}ta.remove()}
}

/* ---------- cart ---------- */
function loadCart(){try{const a=JSON.parse(lsGet('modex.cart')||'[]');if(Array.isArray(a))S.cart=a.filter(x=>x&&typeof x.id==='string'&&Number.isInteger(x.q)&&x.q>0).slice(0,40)}catch(e){}}
function saveCart(){lsSet('modex.cart',JSON.stringify(S.cart));paintBadge()}
function paintBadge(){const n=S.cart.reduce((a,l)=>a+l.q,0),b=$('#badge');b.hidden=!n;b.textContent=n2(n);b.classList.add('pop');setTimeout(()=>b.classList.remove('pop'),250)}
function lines(){return S.cart.map(l=>{const p=S.items.find(x=>x.id===l.id);if(!p||p.active===false)return null;const opt=l.o>=0&&p.options&&p.options[l.o]?p.options[l.o]:null;return {p,opt,q:l.q,o:l.o,price:opt?+opt.price:+p.price,key:l.id+':'+l.o}}).filter(Boolean)}
function addCart(id,o,q){
  const p=S.items.find(x=>x.id===id);if(!p)return;
  const hasOpt=p.options&&p.options.length;o=hasOpt?(o>=0?o:0):-1;
  const ex=S.cart.find(l=>l.id===id&&l.o===o);
  let nq=(ex?ex.q:0)+q;
  if(p.kind==='physical'&&p.stock!=null) nq=Math.min(nq,Math.max(0,+p.stock));
  if(nq<=0){toast(T('স্টকে নেই'));return}
  if(p.kind==='digital') nq=Math.min(nq,20);
  if(ex)ex.q=nq;else S.cart.push({id,o,q:nq});
  saveCart();toast(T('কার্টে যোগ হয়েছে'));
}
function totals(L){
  const sub=L.reduce((a,x)=>a+x.price*x.q,0);
  const phys=L.filter(x=>x.p.kind==='physical');
  const psub=phys.reduce((a,x)=>a+x.price*x.q,0);
  return {sub,psub,hasPhys:phys.length>0,hasDig:L.some(x=>x.p.kind==='digital')};
}
function shipFee(T,area){
  if(!T.hasPhys) return 0;
  const free=+S.st.freeOver||0;
  if(free>0&&T.psub>=free) return 0;
  return area==='out'?+S.st.deliveryOutside||0:+S.st.deliveryDhaka||0;
}

function visibleItems(){
  let a=S.items.filter(p=>p.active!==false);
  if(S.f.kind!=='all')a=a.filter(p=>p.kind===S.f.kind);
  const q=S.f.q.trim().toLowerCase();
  if(q)a=a.filter(p=>(p.title+' '+tp(p,'title')+' '+(tp(p,'short')||'')+' '+(tp(p,'cat')||'')).toLowerCase().includes(q));
  if(S.f.sort==='low')a=[...a].sort((x,y)=>minPrice(x)-minPrice(y));
  else if(S.f.sort==='high')a=[...a].sort((x,y)=>minPrice(y)-minPrice(x));
  else a=[...a].sort((x,y)=>(y.feat?1:0)-(x.feat?1:0));
  return a;
}

/* hero carousel */
let cur=0,timer=null;
function go(i){
  const n=3;cur=(i+n)%n;
  $$('.slide').forEach((s,j)=>s.classList.toggle('active',j===cur));
  $$('.pill').forEach((p,j)=>{p.classList.remove('on');if(j===cur){void p.offsetWidth;p.classList.add('on')}});
}
function startAuto(){clearInterval(timer);if(RM)return;timer=setInterval(()=>go(cur+1),6500)}
function initHero(){
  cur=0;const h=$('#hero');if(!h)return;
  startAuto();
  let raf=0;
  h.addEventListener('pointermove',e=>{
    if(e.pointerType==='touch'||RM)return;
    const r=h.getBoundingClientRect();const x=((e.clientX-r.left)/r.width-.5)*2,y=((e.clientY-r.top)/r.height-.5)*2;
    cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{h.style.setProperty('--px',(x*12).toFixed(2));h.style.setProperty('--py',(y*12).toFixed(2))});
  });
  h.addEventListener('pointerenter',e=>{if(e.pointerType!=='touch'){clearInterval(timer);h.classList.add('paused')}});
  h.addEventListener('pointerleave',()=>{h.classList.remove('paused');go(cur);startAuto()});
  let sx=0;
  h.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
  h.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50){go(cur+(d<0?1:-1));startAuto()}},{passive:true});
}
let io;
function observe(){
  if(io)io.disconnect();
  if(!('IntersectionObserver' in window)){$$('.rv').forEach(e=>e.classList.add('in'));return}
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.08});
  $$('.rv').forEach(e=>io.observe(e));
}

function cartAdjust(key,d){
  const [id,o]=[key.slice(0,key.lastIndexOf(':')),+key.slice(key.lastIndexOf(':')+1)];

}

const PH_RE=/^(?:\+?88)?01[3-9]\d{8}$/;
const normPh=s=>{const d=digits(s);return d.length===13&&d.startsWith('88')?d.slice(2):d};
function genNo(){return 'MDX-'+Date.now().toString(36).toUpperCase().slice(-6)+Math.random().toString(36).slice(2,4).toUpperCase()}
function orderText(o){
  const en=LANG==='en';
  const nm=i=>(en&&i.te)?i.te:i.t,on=i=>(en&&i.oe)?i.oe:i.o;
  const L=[T('অর্ডার {no}',{no:o.no}),T('নাম: {v}',{v:o.c.n}),T('ফোন: {v}',{v:o.c.ph})];
  if(o.c.ad)L.push(T('ঠিকানা: {v}',{v:o.c.ad})+(o.c.area==='out'?T(' (ঢাকার বাইরে)'):T(' (ঢাকা)')));
  L.push('---');o.items.forEach(i=>L.push(`${nm(i)}${on(i)?' ('+on(i)+')':''} x${i.q} = ${money(i.pr*i.q)}`));
  o.fl.forEach(f=>L.push(`${(en&&f.ie)?f.ie:f.i} – ${(en&&f.le)?f.le:f.l}: ${f.v}`));
  L.push('---',T('সাবটোটাল: {v}',{v:money(o.sub)}));if(o.ship)L.push(T('ডেলিভারি: {v}',{v:money(o.ship)}));L.push(T('মোট: {v}',{v:money(o.total)}));
  L.push(T('পেমেন্ট: {v}',{v:payName(o.pay.m)})+(o.pay.trx?' | TrxID: '+o.pay.trx:''));
  return L.join('\n');
}
async function submitOrder(form){
  const err=$('#err'),btn=$('#placeBtn');err.textContent='';
  const fd=new FormData(form);
  if(fd.get('website'))return fakeDone();
  const L=lines();if(!L.length){err.textContent=T('কার্ট খালি।');return}
  const TT=totals(L),name=String(fd.get('name')||'').trim(),ph=normPh(fd.get('phone')),em=String(fd.get('email')||'').trim();
  if(name.length<2){err.textContent=T('সঠিক নাম লিখুন।');return}
  if(!PH_RE.test(ph)){err.textContent=T('সঠিক মোবাইল নম্বর দিন (যেমন 01XXXXXXXXX)।');return}
  if(em&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){err.textContent=T('ইমেইল ঠিকমতো লিখুন।');return}
  const area=TT.hasPhys?String(fd.get('area')||'dhaka'):'',ad=TT.hasPhys?String(fd.get('addr')||'').trim():'';
  if(TT.hasPhys&&ad.length<8){err.textContent=T('পূর্ণ ঠিকানা লিখুন।');return}
  const fl=[];
  for(const inp of $$('input[name^="f|"]',form)){const v=inp.value.trim();if(inp.required&&!v){err.textContent=T('"{l}" ঘরটি পূরণ করুন।',{l:inp.dataset.dl||inp.dataset.l});return}if(v)fl.push({i:inp.dataset.i,l:inp.dataset.l,ie:inp.dataset.ie||'',le:inp.dataset.le||'',v})}
  const m=String(fd.get('pm')||'bkash');
  if(m==='cod'&&TT.hasDig){err.textContent=T('ডিজিটাল সার্ভিসে ক্যাশ অন ডেলিভারি নেই।');return}
  let trx='',from='';
  if(m!=='cod'){
    trx=String(fd.get('trx')||'').trim().toUpperCase();from=normPh(fd.get('from'));
    if(!/^[A-Z0-9]{8,14}$/.test(trx)){err.textContent=T('সঠিক লেনদেন আইডি (TrxID) দিন।');return}
    if(!PH_RE.test(from)){err.textContent=T('যে নম্বর থেকে পাঠিয়েছেন সেটি দিন।');return}
  }
  const ship=shipFee(TT,area);
  const det={};
  for(const inp of $$('input[name^="f|"]',form)){const v=inp.value.trim();if(!v)continue;const pp=inp.name.split('|');(det[pp[1]]=det[pp[1]]||{})[pp[2]]=v}
  const o={no:'',at:Date.now(),items:L.map(x=>({id:x.p.id,t:x.p.title,te:(x.p.en&&x.p.en.title)||'',o:x.opt?x.opt.label:'',oe:(x.opt&&x.p.en&&Array.isArray(x.p.en.options)&&x.p.en.options[x.o])||'',q:x.q,pr:x.price,k:x.p.kind})),sub:TT.sub,ship,total:TT.sub+ship,c:{n:name,ph,em,ad,area},fl,pay:{m,trx,from},note:String(fd.get('note')||'').trim()};
  btn.disabled=true;btn.textContent=T('অর্ডার হচ্ছে…');
  let saved=false;
  if(S.sb&&S.uid){
    let r;
    try{
      r=await S.sb.rpc('place_order',{p_items:L.map(x=>({id:x.p.id,option:x.opt?x.opt.label:null,qty:x.q,details:det[x.key]||{}})),p_name:name,p_phone:ph,p_address:ad,p_area:area?(area==='out'?'outside':'dhaka'):'',p_note:o.note,p_method:m,p_trx:trx,p_email:em,p_from:from});
    }catch(e){r={error:{message:'network'}}}
    if(r.error){
      const msg=String(r.error.message||'');
      if(/out of stock|unavailable|invalid|required|missing|cod not/i.test(msg)){err.textContent=orderErr(msg);btn.disabled=false;btn.textContent=T('অর্ডার কনফার্ম করুন');loadProducts();return}
    }else{
      const row=Array.isArray(r.data)?r.data[0]:r.data;
      if(row&&row.order_no){o.no=row.order_no;o.total=+row.total;o.ship=o.total-o.sub;saved=true}
    }
  }
  if(!saved)o.no=genNo();
  S.cart=[];saveCart();
  doneView(o,saved);
  if(saved){loadProducts();loadOrders()}
}

async function saveItems(items,msg){
  if(!S.sb||!S.admin){toast('সংযোগ নেই');return false}
  try{
    const cur=new Map(S.items.map(x=>[x.id,JSON.stringify(x)]));
    const ids=new Set(items.map(x=>x.id));
    let ns=Math.max(0,...S.items.map(x=>+x.sort||0));
    const rows=[];
    for(const x of items){const o=cur.get(x.id);if(o===undefined)rows.push(itemToRow({...x,sort:++ns}));else if(o!==JSON.stringify(x))rows.push(itemToRow(x))}
    if(rows.length){const r=await S.sb.from('products').upsert(rows);if(r.error)throw r.error}
    for(const id of cur.keys())if(!ids.has(id)){const r=await S.sb.from('products').delete().eq('id',id);if(r.error)throw r.error}
    await loadProducts();toast(msg||'সেভ হয়েছে');return true;
  }catch(e){toast('সেভ করা যায়নি');return false}
}
async function submitProduct(form){
  const f=new FormData(form),err=$('#perr');err.textContent='';
  const title=String(f.get('title')||'').trim();if(!title){err.textContent='নাম লিখুন।';return}
  const num=k=>{const d=digits(f.get(k));return d?parseInt(d,10):0};
  const options=String(f.get('options')||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const [a,...b]=l.split('|');return {label:a.trim(),price:parseInt(digits(b.join('')),10)||0}}).filter(o=>o.label&&o.price>0).slice(0,12);
  let price=num('price');if(options.length)price=options[0].price;
  if(price<=0){err.textContent='সঠিক দাম দিন।';return}
  const fields=String(f.get('fields')||'').split('\n').map(l=>l.trim()).filter(Boolean).slice(0,6).map((l,i)=>{const o=l.endsWith('?');return {k:'f'+i,label:(o?l.slice(0,-1):l).trim(),ph:'',req:!o}});
  const kind=f.get('kind')==='digital'?'digital':'physical';
  const old=S.items.find(x=>x.id===S.editId)||{};
  const item={...old,id:S.editId||('p-'+Date.now().toString(36)),title,kind,cat:String(f.get('cat')||'').trim(),price,old:num('old'),stock:kind==='physical'?(String(f.get('stock')||'').trim()===''?null:num('stock')):null,badge:String(f.get('badge')||'').trim(),short:String(f.get('short')||'').trim(),desc:String(f.get('desc')||'').trim(),features:String(f.get('features')||'').split('\n').map(l=>l.trim()).filter(Boolean).slice(0,10),options,fields,note:String(f.get('note')||'').trim(),art:String(f.get('art')||'box'),hue:Math.min(360,num('hue')),image:S.editImg||'',feat:!!f.get('feat'),active:old.active!==false};
  const ln2=k=>String(f.get(k)||'').split('\n').map(l=>l.trim()).filter(Boolean);
  const oen=old.en||{};
  item.en={...oen,title:String(f.get('en_title')||'').trim(),cat:String(f.get('en_cat')||'').trim(),badge:String(f.get('en_badge')||'').trim(),short:String(f.get('en_short')||'').trim(),desc:String(f.get('en_desc')||'').trim(),note:String(f.get('en_note')||'').trim(),features:ln2('en_features').slice(0,10),options:ln2('en_options').slice(0,12),fields:ln2('en_fields').slice(0,6)};
  const items=S.editId?S.items.map(x=>x.id===S.editId?item:x):[...S.items,item];
  if(await saveItems(items,'পণ্য সেভ হয়েছে')){$('#dE').close();renderAdmin()}
}

async function shrink(file){
  const bmp=await createImageBitmap(file),k=Math.min(1,1200/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0,c.width,c.height);
  return await new Promise(res=>c.toBlob(res,'image/jpeg',.86));
}
